<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- ?v= changes on every deploy, so browsers (Safari especially) fetch the new CSS instead of an old cached copy -->
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {% include nav.html %}
  {% include characters.html %}

  <main class="content">
    {{ content }}
  </main>

  <script src="{{ '/assets/js/menu.js' | relative_url }}"></script>
</body>
</html>
