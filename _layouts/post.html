---
layout: default
---
<div class="blog-page">
<article class="card post">
  {% if page.cover %}
  <img class="cover" src="{{ page.cover | relative_url }}" alt="{{ page.cover_alt | default: '' | escape }}">
  {% endif %}

  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>

  <div class="post-body">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
  <ul class="tags" aria-label="Tags">
    {% for tag in page.tags %}
    <li><a href="{{ '/blog/' | relative_url }}?tag={{ tag | url_encode }}">{{ tag }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
</article>
</div>
