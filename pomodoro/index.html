---
layout: default
title: pomodoro
body_class: pomodoro
---
{% assign img = '/assets/images/pomodoro/' %}
<h1 class="visually-hidden">Pomodoro timer</h1>

<section class="pomodoro-timer" data-focus-minutes="15" data-break-minutes="5">
  <!-- The cat: every layer is the same size, so they stack exactly.
       pomodoro.js swaps which tail is showing. -->
  <div class="cat-scene" aria-hidden="true">
    <img class="layer" src="{{ img | append: 'surface.png' | relative_url }}" alt="">
    <img class="layer tail is-showing" src="{{ img | append: 'tail-1.png' | relative_url }}" alt="">
    <img class="layer tail" src="{{ img | append: 'tail-2.png' | relative_url }}" alt="">
    <img class="layer tail" src="{{ img | append: 'tail-3.png' | relative_url }}" alt="">
    <img class="layer tail" src="{{ img | append: 'tail-4.png' | relative_url }}" alt="">
    <img class="layer tail" src="{{ img | append: 'tail-5.png' | relative_url }}" alt="">
    <img class="layer" src="{{ img | append: 'cat.png' | relative_url }}" alt="">
  </div>

  <p class="time" role="timer" aria-live="off">15:00</p>

  <div class="controls">
    <!-- One button: says "start" when stopped, "pause" while running -->
    <button type="button" data-action="toggle">start</button>
    <button type="button" data-action="reset">reset</button>

    <!-- The edit panel sits under the edit button, hidden until it's pressed.
         Custom times aren't saved: refreshing the page goes back to 15 / 5. -->
    <div class="edit-group">
      <button type="button" data-action="edit" aria-expanded="false" aria-controls="edit-times">edit</button>
      <form class="edit-times" id="edit-times" hidden>
        <label>focus
          <input type="number" name="focus" min="1" max="180" step="1" inputmode="numeric" required>
          <span class="visually-hidden">minutes</span>
        </label>
        <label>break
          <input type="number" name="break" min="1" max="60" step="1" inputmode="numeric" required>
          <span class="visually-hidden">minutes</span>
        </label>
        <div class="edit-actions">
          <button type="submit">save</button>
          <button type="button" data-action="cancel">cancel</button>
        </div>
      </form>
    </div>
  </div>

  <p class="visually-hidden" aria-live="polite" data-status></p>
</section>

<script src="{{ '/assets/js/pomodoro.js' | relative_url }}"></script>
