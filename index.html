<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mish mash tan</title>
  <meta name="description" content="mish mash tan: artist, coder, community organiser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #FEDBEE;
      --teal: #4DD4CA;
      --maroon: #740E0E;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--pink);
      color: var(--maroon);
      font-family: 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif;
      font-weight: 500;
    }

    /* The "stage" holds everything. On desktop the drawings and text stay
       the same size; only their positions (in %) slide towards the centre
       as the screen gets narrower. */
    .stage {
      position: relative;
      width: min(100% - 32px, 1100px);
      height: 865px;
      margin: 0 auto;
      overflow-x: clip;
    }

    /* On bigger screens, centre the drawing vertically */
    @media (min-width: 801px) {
      body { display: grid; place-items: center; min-height: 100vh; }
    }

    /* Each drawing is placed by its centre point, so it slides inwards evenly */
    .art { position: absolute; display: block; height: auto; transform: translateX(-50%); }
    .art svg { display: block; width: 100%; height: auto; }

    /* ---------- Navigation ---------- */
    .menu-toggle { display: none; }

    .nav {
      position: absolute;
      top: 26px;
      left: 46%;
      transform: translateX(-50%);
      z-index: 3;
    }

    .nav ul {
      display: flex;
      flex-wrap: nowrap;
      white-space: nowrap;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav a {
      display: inline-block;
      background: var(--teal);
      color: var(--white);
      text-decoration: none;
      font-size: 26px;
      line-height: 1;
      padding: 0.45em 1em;
      border-radius: 0.5em;
      transition: transform 0.15s ease;
    }

    .nav a:hover { transform: translateY(-2px) rotate(-1deg); }

    .nav a:focus-visible,
    .menu-toggle:focus-visible,
    .links a:focus-visible {
      outline: 3px solid var(--maroon);
      outline-offset: 3px;
    }

    /* ---------- Artwork positions (desktop) ---------- */
    /* left = where the centre of each item sits; width/top are fixed sizes */
    .title { position: absolute; left: 49.5%; top: 169px; width: 638px; margin: 0; z-index: 1; transform: translateX(-50%); }
    .title .mobile { display: none; }
    .flying  { left: 77.5%; top: 130px; width: 352px; }
    .laptop  { left: 22%;   top: 398px; width: 176px; }
    .waving  { left: 72.5%; top: 480px; width: 198px; }

    /* ---------- Tagline and links ---------- */
    .about {
      position: absolute;
      left: 16.5%;
      top: 709px;
      z-index: 2;
      line-height: 1.35;
    }

    .tagline {
      margin: 0;
      font-size: 24px;
    }

    .links { list-style: none; margin: 0.3em 0 0; padding: 0; font-size: 19px; }
    .links a { color: var(--maroon); text-decoration: underline; text-underline-offset: 3px; }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 800px) {
      .stage {
        width: 100%;
        max-width: 480px;
        height: auto;
        aspect-ratio: 328 / 625;
      }

      .art, .title, .nav { transform: none; }

      .menu-toggle {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        position: absolute;
        top: 2.5%;
        left: 5.5%;
        z-index: 5;
        width: 60px;
        height: 52px;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
        background: var(--teal);
        cursor: pointer;
      }

      .menu-toggle span {
        display: block;
        height: 7px;
        border-radius: 4px;
        background: var(--white);
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(13px) rotate(45deg); }
      .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
      .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-13px) rotate(-45deg); }

      .nav {
        display: none;
        top: calc(2.5% + 62px);
        left: 5.5%;
        right: auto;
        width: 68%;
        z-index: 4;
      }

      .nav.open { display: block; }

      .nav ul { flex-direction: column; gap: 10px; }

      .nav a {
        display: block;
        font-size: clamp(24px, 9vw, 40px);
        padding: 0.2em 0.5em;
        border-radius: 0.3em;
      }

      .title { left: 17.5%; top: 21%; width: 63%; }
      .title .desktop { display: none; }
      .title .mobile { display: block; }
      .flying { left: 30%;  top: 1.5%; width: 68%; }
      .laptop { left: 1.5%; top: 46.5%; width: 39%; }
      .waving { left: 57%;  top: 55%;  width: 40%; }

      .about { left: 4%; top: 80%; line-height: 1.25; }
      .tagline { font-size: clamp(16px, 5.4vw, 24px); }
      .tagline .sep { display: none; }
      .tagline .word { display: block; }
      .links { font-size: clamp(16px, 5.4vw, 24px); margin-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.getElementById('site-nav');

    function setMenu(open) {
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      nav.classList.toggle('open', open);
    }

    toggle.addEventListener('click', () => {
      setMenu(toggle.getAttribute('aria-expanded') !== 'true');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && nav.classList.contains('open')) {
        setMenu(false);
        toggle.focus();
      }
    });

    document.addEventListener('click', (e) => {
      if (nav.classList.contains('open') && !nav.contains(e.target) && !toggle.contains(e.target)) {
        setMenu(false);
      }
    });
  </script>
